name: Go Test CI

on:
  push:
    branches:
      - sandbox
  pull_request:
    branches:
      - sandbox

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Run Tests
        run: go test ./... -v
