name: PR CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  pr-ci:
    # Only run CI when PR comes from sandbox branch
    if: github.event.pull_request.head.ref == 'sandbox'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify dependencies
        run: go mod tidy

      - name: Build
        run: go build -v ./...
